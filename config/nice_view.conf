# nice!view build overrides.
#
# ZMK applies this file only to builds whose shield list contains `nice_view`
# (see app/boards/post_boards_shields.cmake), after the corne shield's own
# .conf files -- so it overrides them.
#
# CAUTION: it is queued BEFORE config/corne.conf, not after (that file's
# candidate list is built with a stale `shield_dir_name`). Anything set in
# corne.conf therefore wins over this file -- keep the two disjoint.

# Let the nice!view draw its own 160x68 status screens. corne_left.conf pins
# the built-in screen and corne_right.conf pins the P-keycap screen; both are
# laid out for a 128x32 OLED. Leaving CORNE_CUSTOM_DISPLAY on would also
# define zmk_display_status_screen() twice.
CONFIG_CORNE_CUSTOM_DISPLAY=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_WIDGET_STATUS=y

# nice!view's peripheral widget defines widget_battery_status_mutex /
# widget_peripheral_status_mutex / zmk_listener_* under the same names as ZMK's
# built-in widgets, which corne_right.conf enables for the OLED P-keycap
# screen. Enabling both duplicates those symbols and fails the link.
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n

# nice!view's own default for a custom status screen; corne_right.conf pins
# this to 4096, too small to render a 160x68 panel.
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# Match upstream nice!view styling -- the mono theme is a corne OLED choice.
CONFIG_LV_USE_THEME_MONO=n
